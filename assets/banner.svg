<svg width="1200" height="400" viewBox="0 0 1200 400"
  xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="speech-integration-starter by eGroupAI">
  <defs>
    <style>
      @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
      @keyframes slideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
      @keyframes drawLine{ to{stroke-dashoffset:0} }
      @keyframes wave    { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.3)} }
      @keyframes pulse   { 0%,100%{opacity:.35} 50%{opacity:.9} }
      @keyframes float   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .t0  { opacity:0; animation:fadeIn  .7s .1s forwards }
      .t1  { opacity:0; animation:fadeIn  .7s .4s forwards }
      .mi  { opacity:0; animation:fadeIn  .6s .5s forwards }
      .wv1 { transform-origin:50% 100%; animation:wave 1.1s .7s infinite }
      .wv2 { transform-origin:50% 100%; animation:wave 1.1s .85s infinite }
      .wv3 { transform-origin:50% 100%; animation:wave 1.1s .6s infinite }
      .wv4 { transform-origin:50% 100%; animation:wave 1.1s .95s infinite }
      .wv5 { transform-origin:50% 100%; animation:wave 1.1s .75s infinite }
      .wv6 { transform-origin:50% 100%; animation:wave 1.1s .5s infinite }
      .wv7 { transform-origin:50% 100%; animation:wave 1.1s .65s infinite }
      .arr { stroke-dasharray:180; stroke-dashoffset:180; animation:drawLine .6s 1.7s forwards }
      .arh { opacity:0; animation:fadeIn .3s 2.2s forwards }
      .alb { opacity:0; animation:fadeIn .4s 1.9s forwards }
      .s1  { opacity:0; animation:slideUp .4s 2.3s forwards }
      .s2  { opacity:0; animation:slideUp .4s 2.6s forwards }
      .s3  { opacity:0; animation:slideUp .4s 2.9s forwards }
      .bg1 { opacity:0; animation:fadeIn  .6s 3.2s forwards }
      .p1  { animation:pulse 2.2s 2.0s infinite }
      .p2  { animation:pulse 2.6s 2.3s infinite }
      .p3  { animation:pulse 2.4s 2.1s infinite }
      .ic  { animation:float 4s 1.5s infinite }
    </style>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#051510">
        <animate attributeName="stop-color" values="#051510;#071C15;#051510" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#082C24">
        <animate attributeName="stop-color" values="#082C24;#0A3630;#082C24" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6EE7C0">
        <animate attributeName="stop-color" values="#6EE7C0;#B6FEE8;#6EE7C0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%"  stop-color="#E8FFF8">
        <animate attributeName="stop-color" values="#E8FFF8;#FFFFFF;#E8FFF8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6EE7C0">
        <animate attributeName="stop-color" values="#6EE7C0;#B6FEE8;#6EE7C0" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0F3628"/>
      <stop offset="100%" stop-color="#071F18"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0B3828"/>
      <stop offset="100%" stop-color="#062018"/>
    </linearGradient>
    <filter id="gw">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sfx">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg0)"/>

  <!-- Ambient glows -->
  <circle cx="150"  cy="400" r="210" fill="#0A6040" opacity=".12" filter="url(#sfx)"/>
  <circle cx="1080" cy="10"  r="170" fill="#0C5C3C" opacity=".10" filter="url(#sfx)"/>

  <!-- Grid -->
  <g opacity=".035" stroke="#3ABEA0" stroke-width=".5">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="240"  y1="0" x2="240"  y2="400"/>
    <line x1="480"  y1="0" x2="480"  y2="400"/>
    <line x1="720"  y1="0" x2="720"  y2="400"/>
    <line x1="960"  y1="0" x2="960"  y2="400"/>
  </g>

  <!-- Title -->
  <g class="t0">
    <text x="600" y="58" text-anchor="middle" fill="url(#tg)"
      font-size="44" font-weight="700"
      font-family="'Segoe UI',system-ui,sans-serif">speech-integration-starter</text>
  </g>
  <g class="t1">
    <text x="600" y="90" text-anchor="middle" fill="#5AC8A0"
      font-size="16" font-family="'Segoe UI',system-ui,sans-serif">
      .wav  ?  transcription segments  ·  eGroupAI ??????
    </text>
  </g>

  <line x1="80" y1="108" x2="1120" y2="108" stroke="#1A5A40" stroke-width=".8" opacity=".5"/>

  <!-- === AUDIO WAVEFORM (left) === -->
  <g transform="translate(96, 128)">
    <g class="mi ic">
      <!-- Container -->
      <rect x="0" y="0" width="176" height="196" rx="8"
        fill="url(#mg)" stroke="#1E5A44" stroke-width="1.5"/>
      <!-- .wav badge -->
      <rect x="8" y="8" width="36" height="17" rx="4" fill="#0E3C2C"/>
      <text x="26" y="20" text-anchor="middle" fill="#4AC8A0"
        font-size="10" font-family="monospace">.wav</text>

      <!-- Animated waveform bars (7 bars) -->
      <g transform="translate(14, 50)">
        <rect class="wv1" x="0"   y="0" width="14" height="80" rx="4" fill="#10C080" opacity=".7"/>
        <rect class="wv2" x="22"  y="0" width="14" height="80" rx="4" fill="#14E89A" opacity=".8"/>
        <rect class="wv3" x="44"  y="0" width="14" height="80" rx="4" fill="#10C080" opacity=".65"/>
        <rect class="wv4" x="66"  y="0" width="14" height="80" rx="4" fill="#14E89A" opacity=".85"/>
        <rect class="wv5" x="88"  y="0" width="14" height="80" rx="4" fill="#10C080" opacity=".7"/>
        <rect class="wv6" x="110" y="0" width="14" height="80" rx="4" fill="#14E89A" opacity=".75"/>
        <rect class="wv7" x="132" y="0" width="14" height="80" rx="4" fill="#10C080" opacity=".7"/>
      </g>
    </g>
    <text x="88" y="218" text-anchor="middle" fill="#3A7A62"
      font-size="12" font-family="'Segoe UI',sans-serif">Audio Input</text>
  </g>

  <!-- === ARROW === -->
  <g transform="translate(316, 218)">
    <line x1="20" y1="26" x2="154" y2="26" stroke="#0D3C2A" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path class="arr"
      d="M 22 26 L 148 26"
      stroke="#0F766E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g class="arh">
      <path d="M 136 14 L 160 26 L 136 38"
        stroke="#0F766E" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="alb" x="90" y="13"
      text-anchor="middle" fill="#3A8A72"
      font-size="13" font-family="monospace">whisper-run</text>
    <circle class="p1" cx="55"  cy="22" r="3"   fill="#0F766E"/>
    <circle class="p2" cx="90"  cy="28" r="2.5" fill="#4ABEA0"/>
    <circle class="p3" cx="120" cy="22" r="2.5" fill="#0F766E"/>
  </g>

  <!-- === SEGMENTS (right) === -->
  <g transform="translate(534, 128)">
    <!-- Segment 1 -->
    <g class="s1">
      <rect x="0"  y="0"  width="330" height="56" rx="6"
        fill="url(#sg2)" stroke="#1A5A40" stroke-width="1.3"/>
      <text x="14" y="21" fill="#5ACCA8" font-size="12.5" font-family="monospace">&#123; "language": "zh",</text>
      <text x="14" y="41" fill="#90DFC4" font-size="12.5" font-family="monospace">  "segments": [ &#123; "start":0.0,</text>
    </g>
    <!-- Segment 2 -->
    <g class="s2">
      <rect x="0"  y="66" width="330" height="56" rx="6"
        fill="url(#sg2)" stroke="#1A5A40" stroke-width="1.3"/>
      <text x="14" y="87" fill="#5ACCA8" font-size="12.5" font-family="monospace">    "end": 3.4,</text>
      <text x="14" y="107" fill="#90DFC4" font-size="12.5" font-family="monospace">    "text": "??????..." &#125;,</text>
    </g>
    <!-- Segment 3 -->
    <g class="s3">
      <rect x="0"  y="132" width="330" height="56" rx="6"
        fill="url(#sg2)" stroke="#1A5A40" stroke-width="1.3"/>
      <text x="14" y="153" fill="#5ACCA8" font-size="12.5" font-family="monospace">    &#123; "start": 3.4, "end": 7.1,</text>
      <text x="14" y="173" fill="#90DFC4" font-size="12.5" font-family="monospace">    "text": "..." &#125; ] &#125;</text>
    </g>
    <text x="165" y="208" text-anchor="middle" fill="#3A7A62"
      font-size="12" font-family="'Segoe UI',sans-serif">Output · JSON</text>
  </g>

  <!-- Bottom pill -->
  <g class="bg1">
    <rect x="360" y="352" width="480" height="30" rx="15"
      fill="#081E16" stroke="#1A4A38" stroke-width="1"/>
    <text x="600" y="372" text-anchor="middle" fill="#3A9070"
      font-size="13" font-family="'Segoe UI',sans-serif">
      MIT License · Free &amp; Open Source · Python 3.11+ · github.com/eGroupAI
    </text>
  </g>
</svg>
